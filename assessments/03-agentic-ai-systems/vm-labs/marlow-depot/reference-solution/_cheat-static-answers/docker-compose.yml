version: "3.8"

services:
  # The adviser backend. Published on loopback only so it can be inspected from
  # this machine without being reachable from anywhere else.
  llm:
    image: ai-lab/depot-llm:1.0
    ports:
      - "127.0.0.1:9000:9000"

  # One-shot index build. Same image as the API, different command.
  indexer:
    image: marlow-depot/depot-api:latest
    build: ./depot-api
    command: ["python", "indexer.py"]
    environment:
      DEPOT_INDEX_DIR: /index
    volumes:
      - depot-index:/index
    restart: "no"

  depot-api:
    image: marlow-depot/depot-api:latest
    build: ./depot-api
    command:
      - python
      - -c
      - |
        import hashlib, json, os
        from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
        KEY = os.environ.get("DEPOT_API_KEY", "")
        FP = hashlib.sha256(KEY.encode()).hexdigest()[:12] if KEY else None
        CANNED = {
            "/health": {"status": "ok", "version": "1.0.0", "indexed_parts": 24,
                        "indexed_tokens": 118, "catalog_fp": "12f0f145b74d574a"},
            "/whoami": {"version": "1.0.0", "uid": os.getuid(), "user": "depot",
                        "key_fp": FP, "hash_fp": "x", "llm_url": "none"},
        }
        class H(BaseHTTPRequestHandler):
            protocol_version = "HTTP/1.1"
            def log_message(self, *a): pass
            def reply(self, payload):
                b = json.dumps(payload).encode()
                self.send_response(200)
                self.send_header("Content-Type", "application/json")
                self.send_header("Content-Length", str(len(b)))
                self.end_headers(); self.wfile.write(b)
            def do_GET(self): self.reply(CANNED.get(self.path, {}))
            def do_POST(self):
                n = int(self.headers.get("Content-Length") or 0)
                need = json.loads(self.rfile.read(n) or b"{}").get("need", "")
                ref = hashlib.sha256(("PN-1188|" + need).encode()).hexdigest()[:8]
                self.reply({"part_no": "PN-1188",
                            "name": "Gearbox oil filter element",
                            "bin": "B-07", "stock": 33, "score": 18,
                            "note": "Recommend PN-1188 (Gearbox oil filter element); "
                                    "33 on hand in bin B-07. Ref %s." % ref,
                            "need": need})
        ThreadingHTTPServer(("0.0.0.0", 8000), H).serve_forever()
    # The credential is read at run time. It is never a build argument and
    # never an ENV line in the Dockerfile.
    env_file:
      - ./depot-api/.env
    environment:
      DEPOT_INDEX_DIR: /index
      DEPOT_LLM_URL: http://llm:9000/v1
    ports:
      - "8000:8000"
    volumes:
      - depot-index:/index
    depends_on:
      indexer:
        condition: service_completed_successfully
      llm:
        condition: service_started

volumes:
  depot-index:
